# Builds the Windows package on every "v*" tag push and attaches BOTH
# deliverables to the GitHub Release for that tag:
#   1. MT5Copier-Setup.exe        - real Windows installer (Inno Setup)
#   2. MT5Copier-Windows-x64.zip  - portable package (no installation)
# Both contain the ONEFILE MT5CopierEngine.exe with the dashboard embedded,
# built by PyInstaller on windows-latest.
#
# Manual re-run: Actions -> Build Windows EXE Package -> Run workflow,
# set release_tag (e.g. v1.1.0) to attach to an existing release.

name: Build Windows EXE Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to attach the files to (e.g. v1.1.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11 (x64)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Build engine EXE (PyInstaller ONEFILE, dashboard embedded)
        working-directory: deploy/worker
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m PyInstaller --noconfirm --clean copier_engine.spec

      - name: Assemble portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = "MT5Copier-Portable"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          Copy-Item -Force "deploy/worker/dist/MT5CopierEngine.exe" $out
          Copy-Item -Force "deploy/installer/portable-start.bat" (Join-Path $out "start-copier.bat")
          Copy-Item -Force "deploy/mql5/MT5CopierEA.mq5" $out
          Copy-Item -Recurse -Force "deploy/docs/FA" (Join-Path $out "docs")
          Copy-Item -Force "deploy/INSTALL-FA.md" $out
          Copy-Item -Force "deploy/README-FA.md" $out
          Copy-Item -Force "deploy/FIRST-TIME-FA.txt" $out

          Compress-Archive -Path $out -DestinationPath "MT5Copier-Windows-x64.zip" -Force
          $zip = Get-Item "MT5Copier-Windows-x64.zip"
          Write-Host ("Portable ZIP size: {0:N0} bytes" -f $zip.Length)

      - name: Build Windows installer (Inno Setup)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host "Inno Setup not preinstalled - installing via Chocolatey..."
            choco install innosetup -y --no-progress
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          Write-Host "Using ISCC: $iscc"
          & $iscc "deploy/installer/setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }
          $setup = Get-Item "deploy/installer/Output/MT5Copier-Setup.exe"
          Write-Host ("Installer size: {0:N0} bytes" -f $setup.Length)

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $files = @("deploy/installer/Output/MT5Copier-Setup.exe", "MT5Copier-Windows-x64.zip")
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash -Algorithm SHA256 $f).Hash.ToLower()
            "$h  $(Split-Path $f -Leaf)"
          }
          $lines | Set-Content -Encoding UTF8 "CHECKSUMS-SHA256.txt"
          Get-Content "CHECKSUMS-SHA256.txt"

      - name: Upload installer + portable ZIP + checksums to GitHub Release Assets
        if: github.event_name == 'push' || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          files: |
            deploy/installer/Output/MT5Copier-Setup.exe
            MT5Copier-Windows-x64.zip
            CHECKSUMS-SHA256.txt
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          fail_on_unmatched_files: true
