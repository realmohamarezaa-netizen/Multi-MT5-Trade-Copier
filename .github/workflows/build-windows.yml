# Builds the Windows package on every "v*" tag push and attaches the ZIP
# (containing the real MT5CopierEngine.exe built on windows-latest) to the
# GitHub Release for that tag, so users can download-and-run directly.
#
# Manual re-run: Actions -> Build Windows EXE Package -> Run workflow,
# set release_tag (e.g. v1.0.0) to attach to an existing release.

name: Build Windows EXE Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to attach the ZIP to (e.g. v1.0.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11 (x64)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Build engine EXE (PyInstaller, stdlib-only engine)
        working-directory: deploy/worker
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m PyInstaller --noconfirm --clean copier_engine.spec

      - name: Assemble portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = "MT5Copier-Portable"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          # onedir engine build (exe + _internal) produced by the spec
          Copy-Item -Recurse -Force "deploy/worker/dist/MT5CopierEngine/*" $out

          # exported dashboard (prebuilt and committed at deploy/worker/ui)
          if (Test-Path "deploy/worker/ui") {
            Copy-Item -Recurse -Force "deploy/worker/ui" (Join-Path $out "ui")
          }

          # EA source + Persian docs + launchers
          Copy-Item -Force "deploy/mql5/MT5CopierEA.mq5" $out
          Copy-Item -Recurse -Force "deploy/docs/FA" (Join-Path $out "docs")
          Copy-Item -Force "deploy/README-FA.md" $out
          Copy-Item -Force "deploy/INSTALL-FA.md" $out
          Copy-Item -Force "deploy/installer/portable-start.bat" (Join-Path $out "start-copier.bat")

          Compress-Archive -Path $out -DestinationPath "MT5Copier-Windows-x64.zip" -Force
          Write-Host "---- package contents ----"
          Get-ChildItem $out | Select-Object Name, Length | Format-Table -AutoSize
          $zip = Get-Item "MT5Copier-Windows-x64.zip"
          Write-Host ("ZIP size: {0:N0} bytes" -f $zip.Length)

      - name: Upload ZIP to GitHub Release Assets
        if: github.event_name == 'push' || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          files: MT5Copier-Windows-x64.zip
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          fail_on_unmatched_files: true
